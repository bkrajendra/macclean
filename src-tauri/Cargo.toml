[package]
name = "macclean"
version = "1.0.4"
description = "MacClean — a native macOS cleanup utility"
authors = ["bkrajendra"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/bkrajendra/macclean"
default-run = "macclean"

[lib]
name = "macclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "macclean"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
macclean-core = { path = "crates/macclean-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
# Enable the (inert until configured) auto-updater plugin.
updater = ["dep:tauri-plugin-updater"]

[dependencies.tauri-plugin-updater]
version = "2"
optional = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
members = ["crates/macclean-core"]
