[package]
name = "macclean"
version = "1.3.0"
description = "MacClean — a native macOS cleanup utility"
authors = ["bkrajendra"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/bkrajendra/macclean"
default-run = "macclean"

[lib]
name = "macclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "macclean"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
macclean-core = { path = "crates/macclean-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
members = ["crates/macclean-core"]
