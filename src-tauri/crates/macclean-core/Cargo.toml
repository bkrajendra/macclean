[package]
name = "macclean-core"
version = "1.0.4"
description = "MacClean filesystem, safety and cleanup-rules engine (no UI, no Tauri)"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/bkrajendra/macclean"

[lib]
name = "macclean_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
dirs = "6"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
